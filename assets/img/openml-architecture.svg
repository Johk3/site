<svg viewBox="0 0 600 560" role="img" aria-labelledby="openml-title openml-desc" xmlns="http://www.w3.org/2000/svg">
<title id="openml-title">Architecture of the OpenML dataset upload platform</title>
<desc id="openml-desc">The React web app asks the FastAPI backend, behind a Caddy proxy, for a short-lived upload contract, then uploads the bytes straight to the quarantine prefix of S3-compatible storage, in parts for large files. After the browser confirms, the backend checks the object metadata and ZIP manifest, has ClamAV scan a temporary copy and promotes clean files to the ready prefix. State is kept in PostgreSQL, and a GitHub issue is opened so experts can review the dataset before it is published.</desc>
<defs>
<marker id="openml-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="dg-box" x="20" y="10" width="250" height="56"/>
<text class="dg-t" x="36" y="33">Web app</text>
<text class="dg-s" x="36" y="53">React 19 · Vite · TanStack Query</text>

<line class="dg-line" x1="145" y1="66" x2="145" y2="108" marker-end="url(#openml-arrow)"/>
<circle class="dg-step" cx="145" cy="87" r="9"/><text class="dg-n" x="145" y="91" text-anchor="middle">1</text>
<circle class="dg-step" cx="167" cy="87" r="9"/><text class="dg-n" x="167" y="91" text-anchor="middle">3</text>

<rect class="dg-chip" x="20" y="110" width="250" height="34"/>
<text class="dg-c" x="36" y="132">Caddy reverse proxy</text>
<line class="dg-line" x1="145" y1="144" x2="145" y2="176" marker-end="url(#openml-arrow)"/>

<rect class="dg-frame" x="20" y="178" width="250" height="232"/>
<text class="dg-t" x="36" y="202">FastAPI backend</text>
<text class="dg-s" x="36" y="220">Python · SQLAlchemy · Alembic</text>
<rect class="dg-chip" x="36" y="234" width="218" height="26"/><text class="dg-c" x="48" y="251">GitHub OAuth, JWT sessions</text>
<rect class="dg-chip" x="36" y="268" width="218" height="26"/><text class="dg-c" x="48" y="285">refresh token families</text>
<rect class="dg-chip" x="36" y="302" width="218" height="26"/><text class="dg-c" x="48" y="319">upload contracts, validation</text>
<rect class="dg-chip" x="36" y="336" width="218" height="26"/><text class="dg-c" x="48" y="353">dataset lifecycle states</text>
<rect class="dg-chip" x="36" y="370" width="218" height="26"/><text class="dg-c" x="48" y="387">Croissant metadata</text>

<rect class="dg-box" x="330" y="10" width="250" height="118"/>
<text class="dg-t" x="346" y="33">S3 object storage</text>
<text class="dg-s" x="346" y="51">MinIO locally, S3 in production</text>
<rect class="dg-chip" x="346" y="62" width="96" height="28"/><text class="dg-c" x="394" y="80" text-anchor="middle">quarantine/</text>
<rect class="dg-chip" x="470" y="62" width="96" height="28"/><text class="dg-c" x="518" y="80" text-anchor="middle">ready/&lt;id&gt;/</text>
<line class="dg-line" x1="442" y1="76" x2="468" y2="76" marker-end="url(#openml-arrow)"/>
<circle class="dg-step" cx="456" cy="106" r="9"/><text class="dg-n" x="456" y="110" text-anchor="middle">5</text>

<line class="dg-line" x1="270" y1="38" x2="328" y2="38" marker-end="url(#openml-arrow)"/>
<circle class="dg-step" cx="299" cy="38" r="9"/><text class="dg-n" x="299" y="42" text-anchor="middle">2</text>

<rect class="dg-box" x="330" y="150" width="250" height="56"/>
<text class="dg-t" x="346" y="173">ClamAV</text>
<text class="dg-s" x="346" y="193">clamd malware scan</text>
<line class="dg-line" x1="270" y1="194" x2="328" y2="194" marker-end="url(#openml-arrow)"/>
<circle class="dg-step" cx="299" cy="194" r="9"/><text class="dg-n" x="299" y="198" text-anchor="middle">4</text>
<line class="dg-line" x1="420" y1="150" x2="420" y2="130" marker-end="url(#openml-arrow)"/>

<rect class="dg-box" x="330" y="246" width="250" height="56"/>
<text class="dg-t" x="346" y="269">PostgreSQL 16</text>
<text class="dg-s" x="346" y="289">users, tokens, datasets, status</text>
<line class="dg-line" x1="270" y1="274" x2="328" y2="274" marker-end="url(#openml-arrow)"/>

<rect class="dg-ext" x="330" y="342" width="250" height="68"/>
<text class="dg-t" x="346" y="365">GitHub</text>
<text class="dg-s" x="346" y="383">external · sign-in, roles,</text>
<text class="dg-s" x="346" y="398">review issues</text>
<line class="dg-line" x1="270" y1="376" x2="328" y2="376" marker-end="url(#openml-arrow)"/>
<circle class="dg-step" cx="299" cy="376" r="9"/><text class="dg-n" x="299" y="380" text-anchor="middle">6</text>

<circle class="dg-step" cx="29" cy="442" r="9"/><text class="dg-n" x="29" y="446" text-anchor="middle">1</text>
<text class="dg-c" x="46" y="446">The browser asks the API for a short-lived upload contract.</text>
<circle class="dg-step" cx="29" cy="462" r="9"/><text class="dg-n" x="29" y="466" text-anchor="middle">2</text>
<text class="dg-c" x="46" y="466">Bytes go straight to quarantine/, in parts for large files.</text>
<circle class="dg-step" cx="29" cy="482" r="9"/><text class="dg-n" x="29" y="486" text-anchor="middle">3</text>
<text class="dg-c" x="46" y="486">The browser confirms; the API checks object metadata and the ZIP manifest.</text>
<circle class="dg-step" cx="29" cy="502" r="9"/><text class="dg-n" x="29" y="506" text-anchor="middle">4</text>
<text class="dg-c" x="46" y="506">ClamAV scans a temporary copy of every file.</text>
<circle class="dg-step" cx="29" cy="522" r="9"/><text class="dg-n" x="29" y="526" text-anchor="middle">5</text>
<text class="dg-c" x="46" y="526">Clean files move to ready/; anything else stays in quarantine.</text>
<circle class="dg-step" cx="29" cy="542" r="9"/><text class="dg-n" x="29" y="546" text-anchor="middle">6</text>
<text class="dg-c" x="46" y="546">A GitHub issue opens so experts can review the dataset before it is published.</text>
</svg>
